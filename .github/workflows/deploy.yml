name: Stat-O'rmon Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:  # qo‘lda ham run qilsa bo‘ladi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: NodeJS o‘rnatish
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # npm ci: package-lock.json dan to'g'ridan-to'g'ri o'rnatadi (npm install'dan tezroq)
      - name: Paketlarni o‘rnatish
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # Secret env orqali uzatiladi: `echo "${{ ... }}"` ichidagi qo'shtirnoqlarni
      # bash o'chirib yuborardi va VITE_EIMZO_API_KEYS JSON bo'lmay qolardi.
      - name: .env faylini Secret'dan tiklash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Projectni build qilish
        run: npm run build

      - name: SSH sozlash
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      # Server host kaliti pin'lanadi (audit C10): SSH_KNOWN_HOSTS secret'i
      # (`ssh-keyscan -H <SERVER_HOST>` natijasi) bo'lsa shu, bo'lmasa keyscan (TOFU).
      - name: Known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS secret yo'q — ssh-keyscan (TOFU) ishlatilmoqda"
            ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          fi

      # rsync faqat o'zgargan fayllarni yuboradi: hash'li nomli assets (shu jumladan
      # ~180 MB video) o'zgarmasa qayta yuklanmaydi. Avval yangi assets, keyin
      # index.html, oxirida eski fayllar o'chiriladi — deploy paytida sayt bo'sh qolmaydi.
      - name: Build qilingan fayllarni serverga yuborish
        env:
          TARGET: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/stat-ormon/
          RSYNC_RSH: ssh
        run: |
          set -euo pipefail
          rsync -az --exclude 'index.html' dist/ "$TARGET"
          rsync -az dist/index.html "$TARGET"
          rsync -az --delete dist/ "$TARGET"

      - name: Nginx reload qilish
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # SSH_FINGERPRINT (ssh-keygen -lf <(ssh-keyscan HOST) ko'rinishida) bo'lsa host kaliti tekshiriladi
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script: |
            echo "Nginx reload qilinyapti..."
            docker exec forest_nginx_prod nginx -s reload

name: Stat-O'rmon Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:  # qo‘lda ham run qilsa bo‘ladi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: NodeJS o‘rnatish
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Paketlarni o‘rnatish
        run: npm install --legacy-peer-deps

      - name: .env faylini Secret'dan tiklash
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Projectni build qilish
        run: npm run build

      - name: Serverdagi eski fayllarni o‘chirish
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Eski build fayllarni o‘chiryapman..."
            rm -rf /var/www/stat-ormon/*

      - name: Build qilingan fayllarni serverga yuborish
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/**"
          target: "/var/www/stat-ormon/"
          strip_components: 1
          debug: true

      - name: Nginx reload qilish
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Nginx reload qilinyapti..."
            docker exec forest_nginx_prod nginx -s reload

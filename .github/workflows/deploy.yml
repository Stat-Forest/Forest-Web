name: Stat-O'rmon CI/CD Pipeline

on:
  push:
    branches:
      - main # Faqat main branch ga push bo‘lganda ishlaydi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v3

      - name: NodeJS o‘rnatish
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Paketlarni o‘rnatish
        run: npm install -f

      - name: Projectni build qilish
        run: npm run build

      - name: Build qilingan fayllarni serverga yuborish
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "dist/*"
          target: "/var/www/stat-ormon"

      - name: Nginx reload qilish
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            sudo systemctl reload nginx

# Nginx konfiguratsiyasi - Forest-Web production uchun
# Bu faylni server'ga ko'chirib, nginx konfiguratsiyasiga qo'shing

server {
    listen 80;
    server_name stat-urmon.uz;
    
    # Root directory
    root /var/www/stat-ormon;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Asset fayllar uchun to'g'ri MIME type'lar
    location ~* \.(js|mjs)$ {
        add_header Content-Type "application/javascript; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css)$ {
        add_header Content-Type "text/css; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Assets papkasi uchun
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Barcha boshqa so'rovlar index.html'ga yo'naltirish (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Favicon va boshqa static fayllar
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="uz_UZ" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="STAT-URMON — O'rmon xo'jaligi statistika portali" />
    <meta name="twitter:description" content="O'zbekiston o'rmon xo'jaligi statistik ma'lumotlarini real vaqtda kuzating." />

    <link rel="icon" type="image/svg+xml" href="./src/assets/logo.png" />

    <!-- Google Fonts: Plus Jakarta Sans (faqat ishlatiladigan og'irliklar) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Performance optimizatsiyasi - Resource hints -->
    <link rel="preconnect" href="https://stat-urmon.uz" crossorigin />
    <link rel="dns-prefetch" href="https://stat-urmon.uz" />

    <!-- E-IMZO scripts - Local versions (from working demo) -->
    <!-- 
    Test muhiti uchun sertifikatlar:
    ✅ USB-token (ID-card, BAIK-token): https://test.e-imzo.uz/registrator/public/ckc.html
    ✅ PFX-ключ: https://test.e-imzo.uz/registrator/public/pfx.html
    ⚠️ Test sertifikatlar faqat test-vpn e-imzo-server da ishlaydi
    
    Note: Local scripts are used instead of CDN to match the working demo behavior.
    CDN scripts may have different API or version, causing compatibility issues.
  -->
    <script src="/e-imzo.js" type="text/javascript" defer></script>
    <script src="/e-imzo-client.js?v=1.2" type="text/javascript" defer></script>
    <script src="/micro-ajax.js" type="text/javascript" defer></script>

    <!-- Use local E-IMZO scripts in /public to avoid CDN/version conflicts.
         defer: sahifa render'ini bloklamaydi, tartib saqlanadi, React (module) dan oldin ishga tushadi -->

    <!-- Clarity faqat landing sahifada (public/clarity.js), tema public/theme-init.js —
         inline skript yo'q: CSP script-src 'self' (nginx.conf, audit A6) -->
    <script src="/theme-init.js"></script>
    <script src="/clarity.js" defer></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
